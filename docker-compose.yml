version: '3.8'

services:
  api:
    container_name: lab_evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    ports:
      - 8081:8080
    volumes:
      - lab_evolution_instances:/lab_evolution/instances
    networks:
      - lab_evolution
    env_file:
      - .env
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - lab_evolution

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6380:6379"
    networks:
      - lab_evolution

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    command:
      - "http"
      - "api:8080"
      - "--url=${NGROK_DOMAIN}" # Puxa o domínio fixo direto do .env
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    networks:
      - lab_evolution
    depends_on:
      - api

  # O Robô de Impressão agora roda de forma resiliente dentro do Docker
  impressora-bot:
    container_name: impressora_bot
    image: python:3.10-slim
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - .:/app # Sincroniza a pasta atual (main.py, logs, pedidos) com o container
    working_dir: /app
    command: sh -c "pip install flask python-escpos python-dotenv && python main.py"
    networks:
      - lab_evolution
    env_file:
      - .env
    depends_on:
      - api

volumes:
  lab_evolution_instances:
  pg_data:

networks:
  lab_evolution:
    driver: bridge